# @package _global_
# Baseline: 200 RDKit 2D descriptors (descriptastorus, CDF-normalized) -> MLP.
defaults:
  - override /readout: mlp_baseline_regress

model:
  name: rdkit_mlp_baseline_regress
  type: features
  featurizers: [rdkit]
  scaling: none           # Descriptors are already normalized to [0, 1]
  readout_lr: 3.0e-4
  feature_workers: 4

train:
  epochs: 100
  batch_size: 64
  weight_decay: 1.0e-3
  grad_clip: 5
