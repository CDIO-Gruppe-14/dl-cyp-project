# @package _global_
# Pretrained Atom-JEPA encoder + readout head, fine-tuned end to end.


defaults:
  - override /readout: mlp_baseline_class

model:
  name: atom_jepa
  type: atom_jepa
  checkpoint: molecules   # Released encoder name or local checkpoint path
  precision: bf16        # bf16 is faster on L40s/A100 but emulated (slower) on V100
  freeze_encoder: false # true trains only the readout head
  encoder_lr: 5.0e-6
  readout_lr: 5.0e-4

train:
  epochs: 30
  batch_size: 128
  weight_decay: 1.0e-2
  grad_clip: 10.0
